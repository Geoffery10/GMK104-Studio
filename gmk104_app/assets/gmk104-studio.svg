<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="GMK104 Studio keyboard with built-in display and rotary knob">
  <rect width="128" height="128" rx="20" fill="#111"/>
  <g transform="rotate(-6 64 64)">
    <!-- A close-up of the keyboard, not a freestanding monitor. -->
    <rect x="9" y="20" width="110" height="91" rx="9" fill="#090909"/>
    <rect x="9" y="16" width="110" height="91" rx="9" fill="#ed1935"/>
    <rect x="13" y="20" width="102" height="82" rx="6" fill="#292a2d"/>

    <!-- Silver control strip: two switches, inset LCD, oversized dial. -->
    <rect x="17" y="24" width="94" height="33" rx="3" fill="#b8bdc3"/>
    <path d="M20 25h88" stroke="#fffaf0" stroke-opacity=".65" stroke-linecap="round"/>
    <circle cx="23" cy="34" r="2" fill="#ed1935"/>
    <circle cx="23" cy="46" r="2" fill="#555b63"/>
    <rect x="28" y="31" width="13" height="5" rx="2.5" fill="#292a2d"/>
    <rect x="28" y="43" width="13" height="5" rx="2.5" fill="#292a2d"/>
    <rect x="46" y="27" width="36" height="27" rx="2" fill="#555b63"/>
    <rect x="49" y="30" width="30" height="21" rx="1" fill="#111"/>
    <path d="m64 31 10 0-8 9h8L59 51l4-9h-8Z" fill="#ed1935"/>
    <circle cx="99" cy="42" r="12" fill="#151619"/>
    <circle cx="99" cy="39" r="11" fill="#777e87"/>
    <circle cx="99" cy="39" r="8.5" fill="#cbd0d5"/>
    <path d="M99 31v4" stroke="#292a2d" stroke-width="2" stroke-linecap="round"/>

    <!-- Staggered red keycaps and dark modifiers remain legible at icon sizes. -->
    <g fill="#090909">
      <rect x="17" y="62" width="94" height="11" rx="2"/>
      <rect x="17" y="76" width="94" height="11" rx="2"/>
      <rect x="17" y="90" width="94" height="10" rx="2"/>
    </g>
    <g fill="#ed1935">
      <rect x="32" y="60" width="12" height="11" rx="2"/>
      <rect x="48" y="60" width="12" height="11" rx="2"/>
      <rect x="64" y="60" width="12" height="11" rx="2"/>
      <rect x="80" y="60" width="12" height="11" rx="2"/>
      <rect x="36" y="74" width="12" height="11" rx="2"/>
      <rect x="52" y="74" width="12" height="11" rx="2"/>
      <rect x="68" y="74" width="12" height="11" rx="2"/>
      <rect x="84" y="74" width="12" height="11" rx="2"/>
      <rect x="39" y="88" width="47" height="10" rx="2"/>
    </g>
    <g fill="#555b63">
      <rect x="17" y="60" width="11" height="11" rx="2"/>
      <rect x="96" y="60" width="15" height="11" rx="2"/>
      <rect x="17" y="74" width="15" height="11" rx="2"/>
      <rect x="100" y="74" width="11" height="11" rx="2"/>
      <rect x="17" y="88" width="18" height="10" rx="2"/>
      <rect x="90" y="88" width="21" height="10" rx="2"/>
    </g>
    <g stroke="#fffaf0" stroke-width="2" stroke-linecap="round" opacity=".75">
      <path d="M36 63h4m12 0h4m12 0h4m12 0h4"/>
      <path d="M40 77h4m12 0h4m12 0h4m12 0h4"/>
      <path d="M52 91h21"/>
    </g>
  </g>
</svg>
