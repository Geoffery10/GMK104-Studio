[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gmk104-studio"
version = "2.0.0"
description = "Native Linux screen editor and keymapper for the ZUOYA GMK104 keyboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Geoffery10", email = "powellgeoffery@gmail.com"}]
# PySide6 6.12.0 corrupts singleton refcounts on CPython 3.11 (PYSIDE-3474).
# Keep newer bindings available on Python 3.12+, which has immortal singletons.
dependencies = [
    "Pillow>=11.3,<14",
    "PySide6>=6.8,<6.12; python_version < '3.12'",
    "PySide6>=6.8,<7; python_version >= '3.12'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/Geoffery10/GMK104-Studio"
Issues = "https://github.com/Geoffery10/GMK104-Studio/issues"

[project.scripts]
gmk104-studio = "gmk104_app.ui:main"
gmk104-upload = "protocol.gmk104:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.12,<7"]

[tool.setuptools]
packages = ["gmk104_app", "gmk104_app.assets", "protocol"]

[tool.setuptools.package-data]
gmk104_app = ["assets/*.svg", "assets/*.json"]
