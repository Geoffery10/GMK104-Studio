name: Tests and AppImage

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 desktop-file-utils
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate version and desktop entry
        run: |
          python -c "import tomllib; from gmk104_app import __version__; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == __version__"
          desktop-file-validate packaging/io.github.Geoffery10.GMK104LinuxImageUploader.desktop
          gmk104-studio --version

  appimage:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 desktop-file-utils squashfs-tools
      - run: python -m pip install -e ".[build]"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from gmk104_app import __version__
          allowed = {"v" + __version__}
          if __version__.endswith(".0"):
              allowed.add("v" + __version__[:-2])
          assert os.environ["RELEASE_TAG"] in allowed, "Tag does not match application version"
          PY
      - name: Build and smoke-test AppImage
        run: python scripts/build-appimage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GMK104-Studio-x86_64
          path: |
            dist/*.AppImage
            dist/70-gmk104.rules
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GMK104-Studio-x86_64
          path: dist
      - name: Verify release files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-is-draft 2>/dev/null; then
            test "$(cat /tmp/release-is-draft)" = "true" || { echo "Refusing to change an already published release"; exit 1; }
            gh release upload "$RELEASE_TAG" dist/* --clobber
            if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
              gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "docs/releases/$RELEASE_TAG.md"
            else
              gh release edit "$RELEASE_TAG" --draft=false --latest
            fi
            exit 0
          fi
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "GMK104 Studio $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "GMK104 Studio $RELEASE_TAG" --generate-notes --latest
          fi
